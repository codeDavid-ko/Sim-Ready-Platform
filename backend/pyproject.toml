[project]
name = "algo-runner"
version = "0.1.0"
description = "URL로 알고리즘을 돌려주는 웹앱 스타터"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "winloop>=0.1; sys_platform == 'win32'",
    # Claude 를 쓸 때만 필요(안 쓰면 지워도 됨):
    "claude-agent-sdk>=0.1",
    "usd-core>=26.5",
    "trimesh>=4.12.2",
    "numpy>=2.4.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algo_runner"]
